<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b18">
  <title>NEON BREAKER — 벽돌깨기</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b18;
      --panel: #11152a;
      --cyan: #31f5e1;
      --pink: #ff4fd8;
      --yellow: #ffe66d;
      --ink: #eaf3ff;
      --muted: #9aa8c7;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 0%, #222755 0%, transparent 48%),
        repeating-linear-gradient(0deg, transparent 0 3px, #ffffff05 3px 4px),
        var(--bg);
      font-family: "Courier New", monospace;
    }

    button { font: inherit; }

    .cabinet {
      width: min(100%, 760px);
      padding: clamp(18px, 4vw, 34px);
      border: 1px solid #444d7b;
      border-radius: 12px;
      background: linear-gradient(145deg, #171b35, #0d1022 72%);
      box-shadow: 0 0 0 5px #0c0e1c, 0 0 45px #4739bb38, inset 0 0 30px #ffffff08;
    }

    header { text-align: center; }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .3em;
    }

    h1 {
      margin: 0;
      color: var(--pink);
      font-size: clamp(27px, 7vw, 48px);
      letter-spacing: .08em;
      text-shadow: 3px 3px 0 #7b2c94, 0 0 22px #ff4fd877;
    }

    .subtitle {
      margin: 8px 0 23px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .12em;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid #30395f;
      border-radius: 5px;
      background: #080b19a8;
      text-align: center;
    }

    .stat-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .16em;
    }

    .stat-value {
      color: var(--yellow);
      font-size: clamp(20px, 5vw, 30px);
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 12px #ffe66d66;
      font-variant-numeric: tabular-nums;
    }

    .stage {
      position: relative;
      overflow: hidden;
      border: 2px solid #39466d;
      border-radius: 4px;
      background: #080b19;
      box-shadow: inset 0 0 30px #000, 0 0 18px #31f5e122;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080b19d9;
      text-align: center;
    }

    .overlay[hidden] { display: none; }

    .dialog {
      width: min(100%, 360px);
      padding: 25px 20px;
      border: 1px solid #4d5482;
      background: #11152a;
      box-shadow: 0 0 28px #ff4fd833;
    }

    .dialog h2 {
      margin: 0 0 8px;
      color: var(--cyan);
      font-size: clamp(24px, 6vw, 34px);
      text-shadow: 0 0 15px #31f5e188;
    }

    .dialog p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .action {
      min-height: 46px;
      padding: 11px 20px;
      border: 0;
      border-radius: 3px;
      color: #080b19;
      background: var(--yellow);
      box-shadow: 0 4px 0 #aa8731, 0 0 18px #ffe66d55;
      cursor: pointer;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .action:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .action:active { transform: translateY(2px); box-shadow: 0 2px 0 #aa8731; }
    .action:focus-visible { outline: 3px solid var(--cyan); outline-offset: 4px; }

    .help {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    kbd {
      padding: 3px 6px;
      border: 1px solid #465072;
      border-bottom-width: 2px;
      border-radius: 3px;
      color: var(--ink);
      background: #171c33;
      font: inherit;
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .cabinet { padding: 18px 13px; }
      .hud { gap: 6px; }
      .stat { padding: 9px 5px; }
      .stat-label { font-size: 10px; }
      .help { gap: 7px 12px; }
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <header>
      <p class="eyebrow">★ ARCADE CLASSIC ★</p>
      <h1>NEON BREAKER</h1>
      <p class="subtitle">벽돌을 깨고 최고 점수에 도전하세요!</p>
    </header>

    <section class="hud" aria-label="게임 정보">
      <div class="stat"><span class="stat-label">점수</span><span class="stat-value" id="score">00000</span></div>
      <div class="stat"><span class="stat-label">최고 점수</span><span class="stat-value" id="best">00000</span></div>
      <div class="stat"><span class="stat-label">남은 목숨</span><span class="stat-value" id="lives">♥♥♥</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="640" height="480" aria-label="벽돌깨기 게임 화면"></canvas>
      <div class="overlay" id="overlay">
        <div class="dialog">
          <h2 id="message-title">준비됐나요?</h2>
          <p id="message-text">공을 튕겨 모든 벽돌을 깨보세요.
키보드 또는 패들 위에서 마우스로 조작하세요.</p>
          <button class="action" id="start-button" type="button">게임 시작</button>
        </div>
      </div>
    </div>

    <p class="help">
      <span><kbd>←</kbd> <kbd>→</kbd> 패들 이동</span>
      <span><kbd>A</kbd> <kbd>D</kbd> 이동</span>
      <span><kbd>Space</kbd> 시작 / 일시정지</span>
      <span>마우스 · 터치로 조작 가능</span>
    </p>
  </main>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreDisplay = document.getElementById("score");
      const bestDisplay = document.getElementById("best");
      const livesDisplay = document.getElementById("lives");
      const overlay = document.getElementById("overlay");
      const title = document.getElementById("message-title");
      const message = document.getElementById("message-text");
      const startButton = document.getElementById("start-button");
      const W = canvas.width;
      const H = canvas.height;
      const paddle = { x: W / 2 - 48, y: H - 34, width: 96, height: 12, speed: 7 };
      const ball = { x: W / 2, y: H - 54, radius: 7, vx: 3.2, vy: -4.4 };
      const keys = new Set();
      const brickConfig = { rows: 5, columns: 10, width: 50, height: 18, gap: 9, top: 62, left: 23 };
      const colors = ["#ff4fd8", "#ff8c64", "#ffe66d", "#8dff83", "#31f5e1"];
      let bricks = [];
      let score = 0;
      let lives = 3;
      let best = 0;
      let state = "ready";
      let animationFrame = 0;
      let lastTime = 0;

      try {
        best = Number(localStorage.getItem("neon-breaker-best")) || 0;
      } catch (error) {
        console.warn("최고 점수를 불러오지 못했습니다.", error);
      }

      function updateHud() {
        scoreDisplay.textContent = String(score).padStart(5, "0");
        bestDisplay.textContent = String(best).padStart(5, "0");
        livesDisplay.textContent = "♥".repeat(lives) + "♡".repeat(3 - lives);
      }

      function makeBricks() {
        bricks = [];
        for (let row = 0; row < brickConfig.rows; row++) {
          for (let column = 0; column < brickConfig.columns; column++) {
            bricks.push({
              x: brickConfig.left + column * (brickConfig.width + brickConfig.gap),
              y: brickConfig.top + row * (brickConfig.height + brickConfig.gap),
              width: brickConfig.width,
              height: brickConfig.height,
              color: colors[row],
              alive: true
            });
          }
        }
      }

      function resetBall() {
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius - 2;
        ball.vx = (Math.random() < 0.5 ? -1 : 1) * 3.2;
        ball.vy = -4.4;
      }

      function resetGame() {
        score = 0;
        lives = 3;
        paddle.x = W / 2 - paddle.width / 2;
        makeBricks();
        resetBall();
        updateHud();
        draw();
      }

      function showOverlay(heading, text, buttonText) {
        title.textContent = heading;
        message.textContent = text;
        startButton.textContent = buttonText;
        overlay.hidden = false;
      }

      function startGame() {
        if (state === "playing") return;
        if (state === "ready" || state === "over" || state === "won") resetGame();
        state = "playing";
        overlay.hidden = true;
        lastTime = 0;
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(loop);
      }

      function pauseGame() {
        if (state !== "playing") return;
        state = "paused";
        cancelAnimationFrame(animationFrame);
        showOverlay("잠시 멈춤", "준비되면 다시 이어서 플레이하세요.", "계속하기");
      }

      function finishGame(won) {
        state = won ? "won" : "over";
        cancelAnimationFrame(animationFrame);
        showOverlay(
          won ? "스테이지 클리어!" : "게임 오버",
          won ? `멋져요! 최종 점수 ${score}점` : `최종 점수 ${score}점 · 최고 기록에 도전하세요!`,
          "다시 시작"
        );
        startButton.focus();
      }

      function saveBest() {
        if (score <= best) return;
        best = score;
        try {
          localStorage.setItem("neon-breaker-best", String(best));
        } catch (error) {
          console.warn("최고 점수를 저장하지 못했습니다.", error);
        }
        updateHud();
      }

      function roundRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#080b19";
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = "#29304b";
        ctx.lineWidth = 1;
        for (let y = 0; y < H; y += 24) {
          ctx.beginPath();
          ctx.moveTo(0, y + 0.5);
          ctx.lineTo(W, y + 0.5);
          ctx.stroke();
        }

        for (const brick of bricks) {
          if (!brick.alive) continue;
          ctx.shadowColor = brick.color;
          ctx.shadowBlur = 10;
          ctx.fillStyle = brick.color;
          roundRect(brick.x, brick.y, brick.width, brick.height, 3);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#ffffff55";
          ctx.fillRect(brick.x + 5, brick.y + 3, brick.width - 10, 2);
        }

        ctx.shadowColor = "#31f5e1";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#31f5e1";
        roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
        ctx.fill();

        ctx.shadowColor = "#ffffff";
        ctx.shadowBlur = 16;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function update(delta) {
        const step = Math.min(delta / 16.67, 2);
        if (keys.has("ArrowLeft") || keys.has("a")) paddle.x -= paddle.speed * step;
        if (keys.has("ArrowRight") || keys.has("d")) paddle.x += paddle.speed * step;
        paddle.x = Math.max(0, Math.min(W - paddle.width, paddle.x));

        ball.x += ball.vx * step;
        ball.y += ball.vy * step;

        if (ball.x - ball.radius <= 0 || ball.x + ball.radius >= W) ball.vx *= -1;
        if (ball.y - ball.radius <= 0) ball.vy = Math.abs(ball.vy);

        if (
          ball.vy > 0 &&
          ball.y + ball.radius >= paddle.y &&
          ball.y - ball.radius <= paddle.y + paddle.height &&
          ball.x >= paddle.x - ball.radius &&
          ball.x <= paddle.x + paddle.width + ball.radius
        ) {
          const hit = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.08, 8);
          const angle = hit * (Math.PI / 3);
          ball.vx = speed * Math.sin(angle);
          ball.vy = -Math.abs(speed * Math.cos(angle));
          ball.y = paddle.y - ball.radius;
        }

        for (const brick of bricks) {
          if (
            brick.alive &&
            ball.x + ball.radius >= brick.x &&
            ball.x - ball.radius <= brick.x + brick.width &&
            ball.y + ball.radius >= brick.y &&
            ball.y - ball.radius <= brick.y + brick.height
          ) {
            brick.alive = false;
            ball.vy *= -1;
            score += 10;
            saveBest();
            updateHud();
            break;
          }
        }

        if (bricks.every(brick => !brick.alive)) {
          finishGame(true);
          return;
        }

        if (ball.y - ball.radius > H) {
          lives--;
          updateHud();
          if (lives <= 0) {
            finishGame(false);
          } else {
            resetBall();
          }
        }
      }

      function loop(timestamp) {
        if (state !== "playing") return;
        const delta = lastTime ? timestamp - lastTime : 16.67;
        lastTime = timestamp;
        update(delta);
        draw();
        if (state === "playing") animationFrame = requestAnimationFrame(loop);
      }

      function movePaddleTo(clientX) {
        const bounds = canvas.getBoundingClientRect();
        const scale = W / bounds.width;
        paddle.x = Math.max(0, Math.min(W - paddle.width, (clientX - bounds.left) * scale - paddle.width / 2));
      }

      startButton.addEventListener("click", startGame);
      canvas.addEventListener("pointermove", event => movePaddleTo(event.clientX));
      canvas.addEventListener("pointerdown", event => {
        movePaddleTo(event.clientX);
        if (state === "ready") startGame();
      });

      window.addEventListener("keydown", event => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (["ArrowLeft", "ArrowRight", " "].includes(key)) event.preventDefault();
        if (key === " " && !event.repeat) {
          if (state === "playing") pauseGame();
          else startGame();
          return;
        }
        keys.add(key);
      });

      window.addEventListener("keyup", event => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        keys.delete(key);
      });
      window.addEventListener("blur", () => keys.clear());

      makeBricks();
      updateHud();
      draw();
    })();
  </script>
</body>
</html>
